<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="memory-architecture-title memory-architecture-desc"><title id="memory-architecture-title">经验层 · 候选、人审与当前有效性</title><desc id="memory-architecture-desc">从宿主采集到私有候选，下次先读材料再人审，经统一筛选进入原流程；关闭或撤销保留真实依赖。</desc><defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#4f5d75"/></marker></defs><rect width="1200" height="800" fill="#f5f5f5"/><text x="40" y="44" font-size="14" fill="#4f5d75" font-weight="400">LAB-REPORT / 2.1</text><text x="40" y="88" font-size="30" fill="#2d3142" font-weight="600">经验层 · 候选、人审与当前有效性</text><path d="M344 212 H420" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M772 212 H848" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M1004 284 V328" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M848 396 H772" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M420 396 H344" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M196 460 V500 H600 V544" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/><rect x="40" y="140" width="304" height="144" rx="6" fill="#f5f5f5" stroke="#2563a6" stroke-width="2"/><text x="56" y="166" font-size="13" fill="#2563a6" font-weight="400">新增</text><text x="56" y="200" font-size="22" fill="#2d3142" font-weight="600">宿主 / 主编排者</text><text x="56" y="228" font-size="15" fill="#4f5d75" font-weight="400">事件处 collect；显式会话身份</text><text x="56" y="252" font-size="15" fill="#4f5d75" font-weight="400">无 hooks 仍可检查点调用</text><rect x="420" y="140" width="352" height="144" rx="6" fill="#f5f5f5" stroke="#2563a6" stroke-width="2"/><text x="436" y="166" font-size="13" fill="#2563a6" font-weight="400">新增</text><text x="436" y="200" font-size="22" fill="#2d3142" font-weight="600">私有根 · 统一权威</text><text x="436" y="228" font-size="15" fill="#4f5d75" font-weight="400">追加分片 / 不可变正文 / registry</text><text x="436" y="252" font-size="15" fill="#4f5d75" font-weight="400">锁 + 原子替换；视图可重建</text><rect x="848" y="140" width="312" height="144" rx="6" fill="#f5f5f5" stroke="#2563a6" stroke-width="2"/><text x="864" y="166" font-size="13" fill="#2563a6" font-weight="400">新增</text><text x="864" y="200" font-size="22" fill="#2d3142" font-weight="600">待审候选与回顾</text><text x="864" y="228" font-size="15" fill="#4f5d75" font-weight="400">本轮保存；自动保存不等于生效</text><text x="864" y="252" font-size="15" fill="#4f5d75" font-weight="400">假设不能驱动执行</text><rect x="848" y="328" width="312" height="144" rx="6" fill="#f5f5f5" stroke="#2563a6" stroke-width="2"/><text x="864" y="354" font-size="13" fill="#2563a6" font-weight="400">新增</text><text x="864" y="388" font-size="22" fill="#2d3142" font-weight="600">下次明确使用 · 人审</text><text x="864" y="416" font-size="15" fill="#4f5d75" font-weight="400">先读材料；冻结展示集合</text><text x="864" y="440" font-size="15" fill="#4f5d75" font-weight="400">真实回应核对 → 逐项批准</text><rect x="420" y="328" width="352" height="144" rx="6" fill="#f5f5f5" stroke="#2563a6" stroke-width="2"/><text x="436" y="354" font-size="13" fill="#2563a6" font-weight="400">新增</text><text x="436" y="388" font-size="22" fill="#2d3142" font-weight="600">少量有效上下文</text><text x="436" y="416" font-size="15" fill="#4f5d75" font-weight="400">先核状态 / 批准 / 来源 / 依赖</text><text x="436" y="440" font-size="15" fill="#4f5d75" font-weight="400">再匹配范围；应用前再次核查</text><rect x="40" y="328" width="304" height="144" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="2"/><text x="56" y="354" font-size="13" fill="#bf4520" font-weight="400">受影响 · 原门槛保留</text><text x="56" y="388" font-size="22" fill="#2d3142" font-weight="600">原五段流程</text><text x="56" y="416" font-size="15" fill="#4f5d75" font-weight="400">记录实际应用；独审双重绑定</text><text x="56" y="440" font-size="15" fill="#4f5d75" font-weight="400">finish 同锁核查并写 done</text><rect x="40" y="544" width="1120" height="120" rx="6" fill="#f5f5f5" stroke="#697386" stroke-width="2"/><text x="56" y="570" font-size="13" fill="#697386" font-weight="400">原职责保留</text><text x="56" y="604" font-size="22" fill="#2d3142" font-weight="600">关闭回退与撤销影响</text><text x="56" y="632" font-size="15" fill="#4f5d75" font-weight="400">无依赖继续原流程；已有依赖失效只复核相关部分，解除后重新独审；原模板、页面与元数据门槛保留</text><text x="40" y="708" font-size="16" fill="#4f5d75" font-weight="400">范围：受控入口与单一私有根；不承诺同权限伪造检测、外部注入隔离或不可观测的整根回滚检测。</text><path d="M40 736 H1160" stroke="#bfc0c0"/><rect x="40" y="754" width="20" height="20" fill="none" stroke="#2563a6" stroke-width="2"/><text x="72" y="770" font-size="15" fill="#4f5d75" font-weight="400">新增：经验层</text><rect x="360" y="754" width="20" height="20" fill="none" stroke="#bf4520" stroke-width="2"/><text x="392" y="770" font-size="15" fill="#4f5d75" font-weight="400">受影响：原环节与门槛保留</text><rect x="680" y="754" width="20" height="20" fill="none" stroke="#697386" stroke-width="2"/><text x="712" y="770" font-size="15" fill="#4f5d75" font-weight="400">灰框：保持原职责</text></svg>
