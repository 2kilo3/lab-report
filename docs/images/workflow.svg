<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 744" role="img" aria-labelledby="workflow-title workflow-desc"><title id="workflow-title">实验文档 · 五段流程与受监督经验</title><desc id="workflow-desc">橙框为受经验影响的五段流程，蓝框为新增采集与下次人审，灰框为原流程回退；验收门槛保持。</desc><defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#4f5d75"/></marker></defs><rect width="1200" height="744" fill="#f5f5f5"/><text x="40" y="44" font-size="14" fill="#4f5d75" font-weight="400">LAB-REPORT / 2.1</text><text x="40" y="88" font-size="30" fill="#2d3142" font-weight="600">实验文档 · 五段流程与受监督经验</text><path d="M240 216 H268" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M472 216 H500" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M704 216 H732" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M936 216 H964" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 280 V332" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M320 384 H24 Q16 384 16 376 V124 Q16 116 24 116 H132 Q140 116 140 124 V132" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/><rect x="40" y="132" width="200" height="148" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="2"/><text x="56" y="158" font-size="13" fill="#bf4520" font-weight="400">受影响 · 原门槛保留</text><text x="56" y="192" font-size="22" fill="#2d3142" font-weight="600">01 意图与确认</text><text x="56" y="220" font-size="15" fill="#4f5d75" font-weight="400">先读当前材料</text><text x="56" y="244" font-size="15" fill="#4f5d75" font-weight="400">再合并经验审核</text><rect x="272" y="132" width="200" height="148" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="2"/><text x="288" y="158" font-size="13" fill="#bf4520" font-weight="400">受影响 · 原门槛保留</text><text x="288" y="192" font-size="22" fill="#2d3142" font-weight="600">02 实验与取证</text><text x="288" y="220" font-size="15" fill="#4f5d75" font-weight="400">本轮真实证据</text><text x="288" y="244" font-size="15" fill="#4f5d75" font-weight="400">经验只辅助方法</text><rect x="504" y="132" width="200" height="148" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="2"/><text x="520" y="158" font-size="13" fill="#bf4520" font-weight="400">受影响 · 原门槛保留</text><text x="520" y="192" font-size="22" fill="#2d3142" font-weight="600">03 写作与排版</text><text x="520" y="220" font-size="15" fill="#4f5d75" font-weight="400">副本允许区域</text><text x="520" y="244" font-size="15" fill="#4f5d75" font-weight="400">保护固定区与样式</text><rect x="736" y="132" width="200" height="148" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="2"/><text x="752" y="158" font-size="13" fill="#bf4520" font-weight="400">受影响 · 原门槛保留</text><text x="752" y="192" font-size="22" fill="#2d3142" font-weight="600">04 独立审查</text><text x="752" y="220" font-size="15" fill="#4f5d75" font-weight="400">原材料与采用记录</text><text x="752" y="244" font-size="15" fill="#4f5d75" font-weight="400">双重版本绑定</text><rect x="968" y="132" width="200" height="148" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="2"/><text x="984" y="158" font-size="13" fill="#bf4520" font-weight="400">受影响 · 原门槛保留</text><text x="984" y="192" font-size="22" fill="#2d3142" font-weight="600">05 复核与交付</text><text x="984" y="220" font-size="15" fill="#4f5d75" font-weight="400">最后页面与作者回读</text><text x="984" y="244" font-size="15" fill="#4f5d75" font-weight="400">finish 当前撤销核查</text><rect x="320" y="332" width="580" height="120" rx="6" fill="#f5f5f5" stroke="#2563a6" stroke-width="2"/><text x="336" y="358" font-size="13" fill="#2563a6" font-weight="400">新增</text><text x="336" y="392" font-size="22" fill="#2d3142" font-weight="600">本轮增量采集 → 检查点保存候选</text><text x="336" y="420" font-size="15" fill="#4f5d75" font-weight="400">结尾只落盘；下次明确使用再读材料、展示、人审</text><rect x="40" y="492" width="1120" height="120" rx="6" fill="#f5f5f5" stroke="#697386" stroke-width="2"/><text x="56" y="518" font-size="13" fill="#697386" font-weight="400">原职责保留</text><text x="56" y="552" font-size="22" fill="#2d3142" font-weight="600">关闭 / 空库 / 不可用时的原流程</text><text x="56" y="580" font-size="15" fill="#4f5d75" font-weight="400">从未采用：正常继续；已经采用：保留依赖，恢复核查或局部复核后显式解除</text><text x="40" y="654" font-size="16" fill="#4f5d75" font-weight="400">统一核查位置：应用前、status / 恢复、record_review、finish；撤销不直接改写任务状态。</text><path d="M40 680 H1160" stroke="#bfc0c0"/><rect x="40" y="698" width="20" height="20" fill="none" stroke="#2563a6" stroke-width="2"/><text x="72" y="714" font-size="15" fill="#4f5d75" font-weight="400">新增：经验层</text><rect x="360" y="698" width="20" height="20" fill="none" stroke="#bf4520" stroke-width="2"/><text x="392" y="714" font-size="15" fill="#4f5d75" font-weight="400">受影响：原环节与门槛保留</text><rect x="680" y="698" width="20" height="20" fill="none" stroke="#697386" stroke-width="2"/><text x="712" y="714" font-size="15" fill="#4f5d75" font-weight="400">灰框：保持原职责</text></svg>
